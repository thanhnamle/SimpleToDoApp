@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <!-- Overlay backdrop -->
    <div (click)="onClose()" class="fixed inset-0 bg-slate-950/60 dark:bg-slate-950/80 backdrop-blur-sm transition-opacity"></div>

    <!-- Modal body -->
    <div class="z-10 w-full max-w-lg overflow-hidden rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-2xl transition-all">
      <!-- Header -->
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-900 bg-slate-50 dark:bg-slate-950/40 px-6 py-4">
        <h3 class="text-lg font-bold text-slate-950 dark:text-white">
          {{ isEditMode ? 'Edit Task' : 'Create New Task' }}
        </h3>
        <button
          (click)="onClose()"
          class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white transition-colors"
        >
          <svg lucideX class="h-5 w-5"></svg>
        </button>
      </div>

      <!-- Form Body -->
      <form (ngSubmit)="onSubmit()" class="p-6 space-y-4">
        <!-- Error Alert -->
        @if (error) {
          <div class="flex items-center gap-3 rounded-lg border border-red-500/20 bg-red-500/10 p-3 text-xs text-red-600 dark:text-red-400">
            <svg lucideAlertTriangle class="h-4.5 w-4.5 shrink-0"></svg>
            <p>{{ error }}</p>
          </div>
        }

        <!-- Title -->
        <div>
          <label for="modal-title" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Title *</label>
          <input
            id="modal-title"
            type="text"
            name="title"
            required
            class="mt-1.5 w-full rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/60 px-3.5 py-2 text-sm text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 outline-none focus:border-indigo-500 transition-all"
            placeholder="What needs to be done?"
            [(ngModel)]="formData.title"
          />
        </div>

        <!-- Description -->
        <div>
          <label for="modal-desc" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Description</label>
          <textarea
            id="modal-desc"
            name="description"
            rows="3"
            class="mt-1.5 w-full rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/60 px-3.5 py-2 text-sm text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 outline-none focus:border-indigo-500 transition-all resize-none"
            placeholder="Add detailed task notes..."
            [(ngModel)]="formData.description"
          ></textarea>
        </div>

        <!-- Category & Priority Grid -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="modal-category" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Category</label>
            <input
              id="modal-category"
              type="text"
              name="category"
              class="mt-1.5 w-full rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/60 px-3.5 py-2 text-sm text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 outline-none focus:border-indigo-500 transition-all"
              placeholder="e.g. Work, Health"
              [(ngModel)]="formData.category"
            />
          </div>

          <div>
            <label for="modal-priority" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Priority</label>
            <select
              id="modal-priority"
              name="priority"
              class="mt-1.5 w-full rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/60 px-3 py-2 text-sm text-slate-800 dark:text-slate-300 outline-none focus:border-indigo-500 transition-all cursor-pointer"
              [(ngModel)]="formData.priority"
            >
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
          </div>
        </div>

        <!-- Status & All Day Switches -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="modal-status" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Status</label>
            <select
              id="modal-status"
              name="status"
              class="mt-1.5 w-full rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/60 px-3 py-2 text-sm text-slate-800 dark:text-slate-300 outline-none focus:border-indigo-500 transition-all cursor-pointer"
              [(ngModel)]="formData.status"
            >
              <option value="Pending">Pending</option>
              <option value="InProgress">In Progress</option>
              <option value="Done">Done</option>
            </select>
          </div>

          <div class="flex items-center justify-between pt-5">
            <label for="modal-allday" class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">All Day Event</label>
            <input
              id="modal-allday"
              type="checkbox"
              name="isAllDay"
              class="h-4.5 w-4.5 rounded border-slate-300 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
              [(ngModel)]="formData.isAllDay"
            />
          </div>
        </div>

        <!-- Dates Grid -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="modal-start" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Start Date</label>
            <input
              id="modal-start"
              type="datetime-local"
              name="startDate"
              class="mt-1.5 w-full rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/60 px-3 py-2 text-sm text-slate-800 dark:text-slate-300 outline-none focus:border-indigo-500 transition-all"
              [(ngModel)]="formData.startDate"
            />
          </div>

          <div>
            <label for="modal-due" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Due Date</label>
            <input
              id="modal-due"
              type="datetime-local"
              name="dueDate"
              class="mt-1.5 w-full rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/60 px-3 py-2 text-sm text-slate-800 dark:text-slate-300 outline-none focus:border-indigo-500 transition-all"
              [(ngModel)]="formData.dueDate"
            />
          </div>
        </div>

        <!-- Footer / Actions -->
        <div class="flex items-center justify-end gap-3 border-t border-slate-200 dark:border-slate-900 pt-5 mt-6">
          <button
            type="button"
            (click)="onClose()"
            class="rounded-lg border border-slate-200 dark:border-slate-800 bg-transparent px-4 py-2.5 text-sm font-semibold text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-900 hover:text-slate-900 dark:hover:text-white transition-colors cursor-pointer"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="rounded-lg bg-gradient-to-r from-indigo-500 to-violet-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-500/10 hover:from-indigo-600 hover:to-violet-700 hover:shadow-indigo-500/20 active:scale-98 transition-all cursor-pointer"
          >
            {{ isEditMode ? 'Save Changes' : 'Add Task' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
