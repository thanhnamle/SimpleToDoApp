<div class="flex min-h-screen items-center justify-center bg-slate-50 dark:bg-slate-950 px-4 py-12 sm:px-6 lg:px-8 relative overflow-hidden transition-colors duration-200">
  <!-- Theme Toggler (Top Right) -->
  <div class="absolute top-6 right-6 z-20">
    <button
      (click)="toggleTheme()"
      type="button"
      class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 shadow-sm transition-all hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer"
      [title]="isDark() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
    >
      @if (isDark()) {
        <svg lucideSun class="h-5 w-5 text-amber-400"></svg>
      } @else {
        <svg lucideMoon class="h-5 w-5 text-indigo-600"></svg>
      }
    </button>
  </div>

  <!-- Background blobs -->
  <div class="absolute top-1/4 left-1/4 h-72 w-72 rounded-full bg-violet-600/5 dark:bg-violet-600/10 blur-[120px]"></div>
  <div class="absolute bottom-1/4 right-1/4 h-72 w-72 rounded-full bg-indigo-600/5 dark:bg-indigo-600/10 blur-[120px]"></div>

  <div class="z-10 w-full max-w-md space-y-8 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/40 p-8 shadow-xl dark:shadow-2xl backdrop-blur-xl transition-all duration-200">
    @if (!isSubmitted()) {
      <div class="flex flex-col items-center justify-center">
        <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-600 text-white shadow-lg shadow-indigo-500/20">
          <svg lucideCheckSquare class="h-7 w-7"></svg>
        </div>
        <h2 class="mt-6 text-center text-3xl font-extrabold tracking-tight text-slate-950 dark:text-white">
          Reset Password
        </h2>
        <p class="mt-2 text-center text-sm text-slate-500 dark:text-slate-400">
          Enter a new secure password for your account.
        </p>
      </div>

      @if (error()) {
        <div class="flex items-center gap-3 rounded-lg border border-red-500/20 bg-red-500/10 p-4 text-sm text-red-600 dark:text-red-400">
          <svg lucideAlertCircle class="h-5 w-5 shrink-0"></svg>
          <p class="leading-relaxed">{{ error() }}</p>
        </div>
      }

      <form class="mt-8 space-y-6" (ngSubmit)="onSubmit()">
        <div class="space-y-4 rounded-md shadow-sm">
          <div>
            <label for="newPassword" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
              New Password
            </label>
            <div class="relative mt-1.5">
              <input
                id="newPassword"
                name="newPassword"
                [type]="showNewPassword ? 'text' : 'password'"
                required
                class="w-full rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950/60 pl-4 pr-12 py-3 text-sm text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 outline-none ring-offset-white dark:ring-offset-slate-900 transition-all focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 focus:ring-offset-2"
                placeholder="Min 8 chars, uppercase, number"
                [(ngModel)]="newPassword"
                [disabled]="isSubmitting() || !token"
              />
              <button
                type="button"
                (click)="showNewPassword = !showNewPassword"
                class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 cursor-pointer"
              >
                @if (showNewPassword) {
                  <svg lucideEyeOff class="h-5 w-5"></svg>
                } @else {
                  <svg lucideEye class="h-5 w-5"></svg>
                }
              </button>
            </div>
          </div>

          <div>
            <label for="confirmPassword" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
              Confirm Password
            </label>
            <div class="relative mt-1.5">
              <input
                id="confirmPassword"
                name="confirmPassword"
                [type]="showConfirmPassword ? 'text' : 'password'"
                required
                class="w-full rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950/60 pl-4 pr-12 py-3 text-sm text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 outline-none ring-offset-white dark:ring-offset-slate-900 transition-all focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 focus:ring-offset-2"
                placeholder="Confirm new password"
                [(ngModel)]="confirmPassword"
                [disabled]="isSubmitting() || !token"
              />
              <button
                type="button"
                (click)="showConfirmPassword = !showConfirmPassword"
                class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 cursor-pointer"
              >
                @if (showConfirmPassword) {
                  <svg lucideEyeOff class="h-5 w-5"></svg>
                } @else {
                  <svg lucideEye class="h-5 w-5"></svg>
                }
              </button>
            </div>
          </div>
        </div>

        <div>
          <button
            type="submit"
            [disabled]="isSubmitting() || !token"
            class="group relative flex w-full justify-center rounded-lg bg-gradient-to-r from-indigo-500 to-violet-600 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-500/10 transition-all hover:from-indigo-600 hover:to-violet-700 hover:shadow-indigo-500/20 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 disabled:pointer-events-none disabled:opacity-50 cursor-pointer"
          >
            @if (isSubmitting()) {
              <svg lucideLoader2 class="h-5 w-5 animate-spin"></svg>
            } @else {
              <span class="flex items-center gap-1.5">
                Reset Password
                <svg lucideArrowRight class="h-4 w-4 transition-transform group-hover:translate-x-0.5"></svg>
              </span>
            }
          </button>
        </div>
      </form>

      <div class="text-center text-sm text-slate-600 dark:text-slate-400">
        Remember your password?
        <a routerLink="/login" class="font-semibold text-indigo-600 dark:text-indigo-400 transition-colors hover:text-indigo-500 dark:hover:text-indigo-300">
          Sign In
        </a>
      </div>
    } @else {
      <div class="flex flex-col items-center justify-center text-center space-y-6 py-6">
        <div class="flex h-16 w-16 items-center justify-center rounded-full bg-emerald-500/10 text-emerald-500 shadow-inner">
          <svg lucideCheckCircle class="h-8 w-8"></svg>
        </div>
        <div class="space-y-2">
          <h2 class="text-2xl font-bold tracking-tight text-slate-950 dark:text-white">
            Password reset complete
          </h2>
          <p class="text-sm text-slate-500 dark:text-slate-400 max-w-sm">
            Your password has been successfully reset. You can now use your new password to sign in.
          </p>
        </div>
        <div class="w-full pt-4">
          <a
            routerLink="/login"
            class="flex w-full justify-center rounded-lg bg-gradient-to-r from-indigo-500 to-violet-600 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-500/10 transition-all hover:from-indigo-600 hover:to-violet-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 cursor-pointer"
          >
            Go to Sign In
          </a>
        </div>
      </div>
    }
  </div>
</div>
