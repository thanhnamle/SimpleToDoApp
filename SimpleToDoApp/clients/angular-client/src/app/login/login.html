<div class="flex min-h-screen items-center justify-center bg-slate-50 dark:bg-slate-950 px-4 py-12 sm:px-6 lg:px-8 relative overflow-hidden transition-colors duration-200">
  <!-- Theme Toggler (Top Right) -->
  <div class="absolute top-6 right-6 z-20">
    <button
      (click)="toggleTheme()"
      type="button"
      class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 shadow-sm transition-all hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer"
      [title]="isDark() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
    >
      @if (isDark()) {
        <svg lucideSun class="h-5 w-5 text-amber-400"></svg>
      } @else {
        <svg lucideMoon class="h-5 w-5 text-indigo-600"></svg>
      }
    </button>
  </div>

  <!-- Background blobs -->
  <div class="absolute top-1/4 left-1/4 h-72 w-72 rounded-full bg-violet-600/5 dark:bg-violet-600/10 blur-[120px]"></div>
  <div class="absolute bottom-1/4 right-1/4 h-72 w-72 rounded-full bg-indigo-600/5 dark:bg-indigo-600/10 blur-[120px]"></div>

  <div class="z-10 w-full max-w-md space-y-8 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/40 p-8 shadow-xl dark:shadow-2xl backdrop-blur-xl transition-all duration-200">
    <div class="flex flex-col items-center justify-center">
      <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-primary dark:bg-primary-dark text-slate-800 dark:text-white shadow-lg shadow-primary/20">
        <svg lucideCheckSquare class="h-7 w-7"></svg>
      </div>
      <h2 class="mt-6 text-center text-3xl font-extrabold tracking-tight text-slate-950 dark:text-white">
        Welcome to <span class="text-primary dark:text-primary-dark">ZenTodo</span>
      </h2>
      <p class="mt-2 text-center text-sm text-slate-500 dark:text-slate-400">
        Streamline your schedule with elegance.
      </p>
    </div>

    @if (error()) {
      <div class="flex items-center gap-3 rounded-lg border border-red-500/20 bg-red-500/10 p-4 text-sm text-red-600 dark:text-red-400">
        <svg lucideAlertCircle class="h-5 w-5 shrink-0"></svg>
        <p>{{ error() }}</p>
      </div>
    }

    <form class="mt-8 space-y-6" (ngSubmit)="onSubmit()">
      <div class="space-y-4 rounded-md shadow-sm">
        <div>
          <label for="usernameOrEmail" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
            Username or Email
          </label>
          <input
            id="usernameOrEmail"
            name="usernameOrEmail"
            type="text"
            required
            class="mt-1.5 w-full rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950/60 px-4 py-3 text-sm text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 outline-none ring-offset-white dark:ring-offset-slate-900 transition-all focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 focus:ring-offset-2"
            placeholder="Enter your username or email"
            [(ngModel)]="usernameOrEmail"
            [disabled]="isSubmitting()"
          />
        </div>

        <div>
          <div class="flex items-center justify-between">
            <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
              Password
            </label>
            <a routerLink="/forgot-password" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 dark:hover:text-indigo-300">
              Forgot password?
            </a>
          </div>
          <div class="relative mt-1.5">
            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              required
              class="w-full rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950/60 pl-4 pr-12 py-3 text-sm text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 outline-none ring-offset-white dark:ring-offset-slate-900 transition-all focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 focus:ring-offset-2"
              placeholder="Enter your password"
              [(ngModel)]="password"
              [disabled]="isSubmitting()"
            />
            <button
              type="button"
              (click)="showPassword = !showPassword"
              class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 cursor-pointer"
            >
              @if (showPassword) {
                <svg lucideEyeOff class="h-5 w-5"></svg>
              } @else {
                <svg lucideEye class="h-5 w-5"></svg>
              }
            </button>
          </div>
        </div>
      </div>

      <div>
        <button
          type="submit"
          [disabled]="isSubmitting()"
          class="group relative flex w-full justify-center rounded-lg bg-primary dark:bg-primary-dark px-4 py-3 text-sm font-semibold text-slate-800 dark:text-white shadow-lg shadow-primary/10 transition-all hover:brightness-95 dark:hover:brightness-110 focus:outline-none focus:ring-2 focus:ring-primary/30 disabled:pointer-events-none disabled:opacity-50 cursor-pointer"
        >
          @if (isSubmitting()) {
            <svg lucideLoader2 class="h-5 w-5 animate-spin"></svg>
          } @else {
            <span class="flex items-center gap-1.5">
              Sign In
              <svg lucideArrowRight class="h-4 w-4 transition-transform group-hover:translate-x-0.5"></svg>
            </span>
          }
        </button>
      </div>

      <a 
        routerLink="/"
        class="group relative flex w-full justify-center rounded-lg bg-slate-100 dark:bg-slate-800 px-4 py-3 text-sm font-semibold text-slate-700 dark:text-slate-300 shadow-sm transition-all hover:bg-slate-200 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-400/30 cursor-pointer"
      >
        <span class="flex items-center gap-1.5">
          <svg lucideArrowLeft class="h-4 w-4 transition-transform group-hover:-translate-x-0.5"></svg>
          Back to Home
        </span>
      </a>
    </form>

    <div class="text-center text-sm text-slate-600 dark:text-slate-400">
      New to ZenTodo?
      <a routerLink="/register" class="font-semibold text-indigo-600 dark:text-indigo-400 transition-colors hover:text-indigo-500 dark:hover:text-indigo-300">
        Create an account
      </a>
    </div>
  </div>
</div>
