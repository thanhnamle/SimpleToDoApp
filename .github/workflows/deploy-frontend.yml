name: Deploy Angular Frontend to GitHub Pages

on:
  push:
    branches:
      - production

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "SimpleToDoApp/clients/angular-client/package-lock.json"

      - name: Install dependencies
        working-directory: SimpleToDoApp/clients/angular-client
        run: npm ci

      - name: Inject Environment Variables
        working-directory: SimpleToDoApp/clients/angular-client
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          # Dùng PowerShell để thay thế nội dung file environment.production.ts
          # Workflow chạy trên ubuntu-latest nên sẽ dùng bash
          cat <<EOF > src/environments/environment.production.ts
          export const environment = {
            production: true,
            apiUrl: '${API_URL:-https://your-render-backend-url.onrender.com/api}'
          };
          EOF

      - name: Build Angular app
        working-directory: SimpleToDoApp/clients/angular-client
        # Add --base-href for GitHub Pages, with repo name
        run: npx ng build --configuration production --base-href /SimpleToDoApp/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The default output folder for Angular 17+ application builder is dist/<project-name>/browser
          path: SimpleToDoApp/clients/angular-client/dist/angular-client/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
